<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Routine</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F4F7;--card:#fff;--ink:#14213D;--mute:#5B667A;--line:#DCE2EA;--health:#12876A;--relationship:#C93A73;--wealth:#B98100;--university:#3B6FD6;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1526;--card:#172038;--ink:#EAF0FA;--mute:#98A4BB;--line:#2A3552;--health:#3FCFA5;--relationship:#F27AA6;--wealth:#F2BE3A;--university:#7FA6FF;--on:#0E1526}}
:root[data-theme="dark"]{--bg:#0E1526;--card:#172038;--ink:#EAF0FA;--mute:#98A4BB;--line:#2A3552;--health:#3FCFA5;--relationship:#F27AA6;--wealth:#F2BE3A;--university:#7FA6FF;--on:#0E1526}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 Figtree,system-ui,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 84px}
.duetab{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.duebackdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.15);z-index:19}
.duebackdrop.show{display:block}
.bbuttons{display:flex}
.duehead{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border:0;background:transparent;cursor:pointer;font-weight:700;min-height:44px;color:var(--ink)}
.duehead[aria-expanded=true]{background:var(--bg)}
.goalblock{border-top:1px solid var(--line);padding:10px 0}
.goalhead{display:flex;align-items:center;gap:8px;font-size:15px}
.goalhead strong{flex:1}
.projrow{display:flex;align-items:center;gap:8px;padding:6px 0 6px 14px;font-size:14px;color:var(--mute)}
.projrow span{flex:1}
.goalhead input[type=checkbox],.projrow input[type=checkbox]{width:20px;height:20px;flex:none}
.duebadge{background:var(--relationship);color:#fff;border-radius:999px;padding:2px 9px;font-size:12px;min-width:20px;text-align:center}
.duetab.empty .duebadge{background:var(--line);color:var(--mute)}
.duelist{display:none;max-height:38vh;overflow-y:auto;padding:0 16px 12px;border-top:1px solid var(--line)}
.duetab.open-due #dueList{display:block}
.duetab.open-goals #goalsList{display:block}
.duerow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.duerow:last-child{border-bottom:0}
header{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.num{font:800 92px/.85 'Bricolage Grotesque',Figtree,sans-serif;letter-spacing:-3px}
.dm{flex:1;min-width:140px}
.day{font:800 30px/1.1 'Bricolage Grotesque',Figtree,sans-serif}
.month{color:var(--mute)}
.nav{display:flex;gap:6px}
button,input,select{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--mute)}
.btn[aria-pressed=true]{background:var(--ink);color:var(--on);border-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.bar{height:8px;background:var(--line);border-radius:8px;margin:22px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ink);border-radius:8px;transition:width .3s}
.sum{color:var(--mute);font-size:14px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}
#hideBtn{padding:6px 10px;min-height:34px;font-size:13px}
.cal{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:none}
.cal.open{display:block}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:600}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.calgrid .wd{color:var(--mute);font-size:12px;padding-bottom:4px}
.calgrid button{background:transparent;border:0;border-radius:8px;padding:8px 0 10px;cursor:pointer;color:var(--ink);position:relative;min-height:0}
.calgrid button.today{font-weight:800}
.calgrid button.sel{background:var(--ink);color:var(--on)}
.calgrid button i{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.8}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.tab{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;cursor:pointer;display:flex;align-items:center;gap:8px}
.tab .dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--ink))}
.tab[aria-pressed=true]{background:var(--ink);color:var(--on);border-color:var(--ink)}
.tab small{opacity:.75}
form{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
form input,form select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;min-height:40px;min-width:0}
form .task,form .add,.range,#mday{grid-column:1/-1}
.range{display:grid;grid-template-columns:1fr 1fr;gap:8px}
form .add{background:var(--ink);color:var(--on);border:0;font-weight:600}
#list{margin-top:18px}
.group{margin:0}
.tasks{list-style:none;margin:0;padding:0;min-height:14px}
.part{display:flex;align-items:baseline;gap:10px;border:0;padding:24px 0 6px}
.part h2{font:800 22px/1.1 'Bricolage Grotesque',Figtree,sans-serif;margin:0}
.part span,.part small{color:var(--mute);font-size:14px}
.part small{margin-left:auto}
.tasks.over-empty{background:var(--bg);border-radius:10px}
.hint{padding:14px 4px;color:var(--mute);font-size:13px;border-top:1px dashed var(--line)}
li.task{display:grid;grid-template-columns:22px minmax(64px,auto) 12px 1fr auto;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);position:relative}
li.task.notime{grid-template-columns:22px 12px 1fr auto}
li.task.notime .time{display:none}
.divider{cursor:pointer;color:var(--line);display:flex;align-items:center;justify-content:center;align-self:stretch}
.divider:hover{color:var(--mute)}
.divider::before{content:'';display:block;width:2px;height:60%;background:currentColor;border-radius:2px}
li.task:last-child{border-bottom:1px solid var(--line)}
.time{white-space:nowrap}
.actions{display:flex;gap:4px;align-items:center}
.chk{border:1px solid var(--line);background:var(--bg);border-radius:8px;min-width:34px;min-height:34px;cursor:pointer;font-size:12px;color:var(--mute)}
.checklist{display:none;grid-column:1/-1;margin:8px 0 2px 32px}
li.task.expanded .checklist{display:block}
.checklist ul{list-style:none;margin:0;padding:0}
.checklist li{display:flex;align-items:center;gap:8px;padding:4px 0;position:relative}
.checklist li.dragging{opacity:.4}
.checklist li.over-top::before,.checklist li.over-bottom::after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--ink);border-radius:2px}
.checklist li.over-top::before{top:-1px}
.checklist li.over-bottom::after{bottom:-1px}
.subgrip{cursor:grab;color:var(--mute);font-size:14px;flex:none}
.checklist input[type=checkbox]{width:18px;height:18px;flex:none}
.checklist span{flex:1;overflow-wrap:anywhere}
.subadd{display:flex;gap:6px;margin-top:4px}
.subadd input{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;min-height:34px}
.due{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);color:var(--mute)}
.due.due-soon{color:var(--wealth);border-color:var(--wealth)}
.due.due-over{color:var(--relationship);border-color:var(--relationship)}
.editpanel{display:none;grid-column:1/-1;margin:10px 0 2px 32px;flex-direction:column;gap:8px}
li.task.editing .editpanel{display:flex}
.editpanel input,.editpanel select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;min-height:40px}
.grip{cursor:grab;color:var(--mute);touch-action:none;user-select:none;font-size:18px;line-height:1;text-align:center}
li.task.dragging{opacity:.4}
li.task.over-top::before,li.task.over-bottom::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--ink);border-radius:3px}
li.task.over-top::before{top:-2px}
li.task.over-bottom::after{bottom:-2px}
.time{color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums}
label{display:flex;align-items:center;gap:12px;cursor:pointer;padding-left:12px;border-left:5px solid var(--c);min-width:0}
label input{width:22px;height:22px;accent-color:var(--c);flex:none}
label span{overflow-wrap:anywhere}
label em{font-style:normal;font-size:13px;color:var(--c);font-weight:600;display:block}
li.done label span{text-decoration:line-through;color:var(--mute)}
.del{border:0;background:transparent;color:var(--mute);cursor:pointer;font-size:22px;line-height:1;padding:6px 10px;border-radius:8px}
.del:hover{color:var(--ink)}
.health{--c:var(--health)}.relationship{--c:var(--relationship)}.wealth{--c:var(--wealth)}.university{--c:var(--university)}
.empty{text-align:center;color:var(--mute);padding:34px 8px;display:flex;flex-direction:column;align-items:center;gap:12px}
@media(max-width:420px){.num{font-size:72px}li.task{grid-template-columns:18px minmax(50px,auto) 10px 1fr auto}li.task.notime{grid-template-columns:18px 10px 1fr auto}.time{font-size:12px}}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="num" id="num">1</div>
    <div class="dm"><div class="day" id="day"></div><div class="month" id="month"></div></div>
    <div class="nav">
      <button class="btn" id="prev" aria-label="Previous day">&larr;</button>
      <button class="btn" id="today">Today</button>
      <button class="btn" id="next" aria-label="Next day">&rarr;</button>
      <button class="btn" id="calBtn" aria-label="Toggle calendar" aria-pressed="false">&#128197;</button>
    </div>
  </header>

  <div class="cal" id="cal">
    <div class="calhead">
      <button class="btn" id="calPrev" aria-label="Previous month">&larr;</button>
      <span id="calLabel"></span>
      <button class="btn" id="calNext" aria-label="Next month">&rarr;</button>
    </div>
    <div class="calgrid" id="calGrid"></div>
  </div>

  <div class="bar" role="progressbar" aria-label="Day progress" aria-valuemin="0" aria-valuemax="100" id="pb"><i id="fill"></i></div>
  <div class="sum" id="sum"></div>
  <div class="toggle-row">
    <div class="sum">Saved on this device</div>
    <button class="btn" id="hideBtn" aria-pressed="false">Hide completed</button>
  </div>

  <div class="tabs" id="tabs"></div>

  <form id="f">
    <input class="task" id="x" type="text" placeholder="What will you do?" maxlength="120" required aria-label="Task">
    <input type="time" id="t" aria-label="Start time (optional)">
    <input type="time" id="t2" aria-label="End time (optional)">
    <select id="p" aria-label="Part of day">
      <option value="morning">Morning</option>
      <option value="noon">Noon</option>
      <option value="afternoon">Afternoon</option>
      <option value="night">Evening</option>
      <option value="unsorted">Unorganized</option>
    </select>
    <input type="date" id="due" aria-label="Due date (optional)" placeholder="Due date">
    <select id="c" aria-label="Category">
      <option value="health">Health</option>
      <option value="relationship">Relationship</option>
      <option value="wealth">Wealth</option>
      <option value="university">University</option>
    </select>
    <select id="goalSel" aria-label="Goal (optional)"><option value="">No goal</option></select>
    <select id="proj" aria-label="Project (optional)"><option value="">No project</option></select>
    <select id="sub" aria-label="Wealth subcategory" style="display:none">
      <option value="">General</option>
      <option value="Career">Career</option>
      <option value="Education">Education</option>
    </select>
    <select id="r" aria-label="Repeat">
      <option value="once">Once</option>
      <option value="daily">Every day</option>
      <option value="weekdays">Weekdays</option>
      <option value="weekends">Weekends</option>
      <option value="weekly">Every week</option>
      <option value="monthly">Every month (specific date)</option>
      <option value="range">Specific dates</option>
    </select>
    <input id="mday" type="number" min="1" max="31" placeholder="Day of month (1\u201331)" style="display:none">
    <div class="range" id="rangeWrap" style="display:none">
      <input type="date" id="ds1" aria-label="Start date">
      <input type="date" id="de1" aria-label="End date">
    </div>
    <button class="btn add" type="submit">Add</button>
  </form>

  <div id="list"></div>
</div>

<div class="duebackdrop" id="dueBackdrop"></div>
<div class="duetab" id="dueTab">
  <div class="bbuttons">
    <button type="button" class="duehead" id="dueToggle" aria-expanded="false">
      <span>&#9200; Due</span><span class="duebadge" id="dueCount">0</span>
    </button>
    <button type="button" class="duehead" id="goalsToggle" aria-expanded="false">
      <span>&#127919; Goals</span><span class="duebadge" id="goalsCount">0</span>
    </button>
  </div>
  <div class="duelist" id="dueList"></div>
  <div class="duelist" id="goalsList"></div>
</div>

<script>
const CATS={health:'Health',relationship:'Relationship',wealth:'Wealth',university:'University'};
const PARTS=[['morning','Morning','5 AM to 11 AM'],['noon','Noon','11 AM to 2 PM'],['afternoon','Afternoon','2 PM to 6 PM'],['night','Evening','6 PM to 5 AM'],['unsorted','Unorganized','No time set']];
const RULES={daily:'every day',weekdays:'weekdays',weekends:'weekends',weekly:'every week'};
const monthShort=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
const fmtRange=(s,e)=>{const a=new Date(s+'T12:00'),b=new Date((e||s)+'T12:00');
  return s===e||!e?monthShort(a):(a.getMonth()===b.getMonth()?a.toLocaleDateString('en-US',{month:'short'})+' '+a.getDate()+'\u2013'+b.getDate():monthShort(a)+'\u2013'+monthShort(b))};
const ruleLabel=i=>i.rule==='range'?fmtRange(i.start,i.end):i.rule==='monthly'?'day '+i.day+' of month':RULES[i.rule];
const $=id=>document.getElementById(id);
let date=new Date();date.setHours(12,0,0,0);
let calMonth=new Date(date);
let filter='all';
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const key=d=>'routine:'+ds(d);
const rd=(k,f)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?f:v}catch(e){return f}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let items=rd(key(date),[]),repeats=rd('routine:repeats',[]),doneR=rd('routine-done:'+ds(date),[]);
let goals=rd('routine:goals',[]),projects=rd('routine:projects',[]);
let hideDone=rd('routine:hideDone2',true);
let hideTime=rd('routine:hideTime',false);
let sharedCol=null,dbReady=false,unsubRepeats=null,unsubItems=null,unsubDone=null,unsubGoals=null,unsubProjects=null;
const save=()=>{wr(key(date),items);if(dbReady)sharedCol.doc('day_'+ds(date)).set({items}).catch(()=>{})};
const saveR=()=>{wr('routine:repeats',repeats);if(dbReady)sharedCol.doc('repeats').set({list:repeats}).catch(()=>{})};
const saveD=()=>{wr('routine-done:'+ds(date),doneR);if(dbReady)sharedCol.doc('done_'+ds(date)).set({ids:doneR}).catch(()=>{})};
const saveGoals=()=>{wr('routine:goals',goals);if(dbReady)sharedCol.doc('goals').set({list:goals}).catch(()=>{})};
const saveProjects=()=>{wr('routine:projects',projects);if(dbReady)sharedCol.doc('projects').set({list:projects}).catch(()=>{})};
const fmt=t=>{if(!t)return'Anytime';const[h,m]=t.split(':').map(Number);return(h%12||12)+':'+String(m).padStart(2,'0')+(h<12?' AM':' PM')};
const fmt2=(t,t2)=>!t?'Anytime':t2?fmt(t)+' \u2013 '+fmt(t2):fmt(t);
const dueInfo=due=>{
  if(!due)return null;
  const now=new Date();now.setHours(12,0,0,0);
  const d=new Date(due+'T12:00');
  const days=Math.round((d-now)/86400000);
  if(days<0)return{label:Math.abs(days)+' day'+(Math.abs(days)===1?'':'s')+' overdue',cls:'due-over'};
  if(days===0)return{label:'Due today',cls:'due-soon'};
  if(days===1)return{label:'Due tomorrow',cls:'due-soon'};
  return{label:days+' days left',cls:days<=3?'due-soon':'due-ok'};
};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const partOf=t=>{if(!t)return null;const m=+t.slice(0,2)*60+ +t.slice(3,5);return m>=300&&m<660?'morning':m>=660&&m<840?'noon':m>=840&&m<1080?'afternoon':'night'};
const applies=(r,d)=>{const s=ds(d),w=d.getDay();if(s<r.start||(r.end&&s>r.end))return false;
  return r.rule==='range'||r.rule==='daily'||(r.rule==='weekdays'&&w>0&&w<6)||(r.rule==='weekends'&&(w===0||w===6))||(r.rule==='weekly'&&w===r.wd)||(r.rule==='monthly'&&d.getDate()===r.day);};
const view=()=>items.map(i=>({...i,ref:i,rep:false,p:i.p||partOf(i.t)||'morning'}))
  .concat(repeats.filter(r=>applies(r,date)).map(r=>({...r,done:doneR.includes(r.id),ref:r,rep:true,p:r.p||partOf(r.t)||'morning'})));
function go(d){date=d;calMonth=new Date(d);items=rd(key(d),[]);doneR=rd('routine-done:'+ds(d),[]);render();subscribeDay(d)}
function shift(n){const d=new Date(date);d.setDate(d.getDate()+n);go(d)}

function subscribeRepeats(){
  if(!dbReady)return;
  if(unsubRepeats)unsubRepeats();
  unsubRepeats=sharedCol.doc('repeats').onSnapshot(snap=>{
    repeats=snap.exists?(snap.data().list||[]):[];wr('routine:repeats',repeats);render();
  },()=>{});
}
function subscribeDay(d){
  if(!dbReady)return;
  const dstr=ds(d);
  if(unsubItems)unsubItems();
  if(unsubDone)unsubDone();
  unsubItems=sharedCol.doc('day_'+dstr).onSnapshot(snap=>{
    if(ds(date)!==dstr)return;
    items=snap.exists?(snap.data().items||[]):[];wr(key(date),items);render();
  },()=>{});
  unsubDone=sharedCol.doc('done_'+dstr).onSnapshot(snap=>{
    if(ds(date)!==dstr)return;
    doneR=snap.exists?(snap.data().ids||[]):[];wr('routine-done:'+dstr,doneR);render();
  },()=>{});
}
function subscribeGoals(){
  if(!dbReady)return;
  if(unsubGoals)unsubGoals();
  unsubGoals=sharedCol.doc('goals').onSnapshot(snap=>{
    goals=snap.exists?(snap.data().list||[]):[];wr('routine:goals',goals);renderGoalsTab();refreshProjectSelect();
  },()=>{});
}
function subscribeProjects(){
  if(!dbReady)return;
  if(unsubProjects)unsubProjects();
  unsubProjects=sharedCol.doc('projects').onSnapshot(snap=>{
    projects=snap.exists?(snap.data().list||[]):[];wr('routine:projects',projects);renderGoalsTab();refreshProjectSelect();
  },()=>{});
}
async function initSync(){
  if(!window.claude)return;
  const db=await window.claude.use('db');
  if(!db)return;
  sharedCol=db.collection('shared');
  dbReady=true;
  const lab=document.querySelector('.toggle-row .sum');if(lab)lab.textContent='Shared \u2014 live with everyone who has access';
  subscribeRepeats();
  subscribeDay(date);
  subscribeGoals();
  subscribeProjects();
}

let dragRef=null,dragEl=null;
let expandedChecklists=new Set();
function row(i){
  const li=document.createElement('li');li.className='task '+i.cat+(i.done?' done':'')+(hideTime?' notime':'')+(expandedChecklists.has(i.id)?' expanded':'');
  li.dataset.p=i.p;
  const grip=document.createElement('div');grip.className='grip';grip.textContent='\u2261';grip.draggable=true;grip.setAttribute('aria-hidden','true');
  grip.addEventListener('dragstart',e=>{dragRef=i;dragEl=li;li.classList.add('dragging');e.dataTransfer.effectAllowed='move'});
  grip.addEventListener('dragend',()=>{li.classList.remove('dragging');dragRef=null;dragEl=null});
  li.addEventListener('dragover',e=>{if(!dragRef||dragRef.id===i.id)return;e.preventDefault();
    const mid=li.getBoundingClientRect().top+li.offsetHeight/2;
    li.classList.toggle('over-top',e.clientY<mid);li.classList.toggle('over-bottom',e.clientY>=mid)});
  li.addEventListener('dragleave',()=>li.classList.remove('over-top','over-bottom'));
  li.addEventListener('drop',e=>{e.preventDefault();const before=li.classList.contains('over-top');
    li.classList.remove('over-top','over-bottom');if(!dragRef||dragRef.id===i.id)return;
    dropOn(dragRef,i,before)});
  const time=document.createElement('div');time.className='time';time.textContent=fmt2(i.t,i.t2);
  const divider=document.createElement('div');divider.className='divider';divider.title=hideTime?'Show time':'Hide time';

function sortedGroup(pk){
  return view().filter(z=>z.p===pk)
    .map(z=>({...z,order:z.order??(z.t?(+z.t.slice(0,2)*60+ +z.t.slice(3,5)):99999)}))
    .sort((a,b)=>a.order-b.order);
}
function moveToGroup(a,targetP){
  a.ref.p=targetP;
  const list=sortedGroup(targetP).filter(z=>z.id!==a.id);
  list.forEach((z,n)=>{z.ref.order=n});
  a.ref.order=list.length;
  save();saveR();render();
}
function dropOn(a,b,before){
  a.ref.p=b.p;
  const list=sortedGroup(b.p).filter(z=>z.id!==a.id);
  let j=list.findIndex(z=>z.id===b.id);
  if(j<0)j=list.length; else if(!before)j+=1;
  list.splice(j,0,a);
  list.forEach((z,n)=>{z.ref.order=n});
  save();saveR();render();
}

function renderCal(){
  $('calLabel').textContent=calMonth.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const g=$('calGrid');g.innerHTML='';
  ['S','M','T','W','T','F','S'].forEach(w=>{const e=document.createElement('div');e.className='wd';e.textContent=w;g.appendChild(e)});
  const first=new Date(calMonth.getFullYear(),calMonth.getMonth(),1);
  const days=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,0).getDate();
  const todayS=ds(new Date());
  for(let i=0;i<first.getDay();i++)g.appendChild(document.createElement('div'));
  for(let d=1;d<=days;d++){
    const dt=new Date(calMonth.getFullYear(),calMonth.getMonth(),d);const s=ds(dt);
    const b=document.createElement('button');b.textContent=d;
    if(s===todayS)b.classList.add('today');

    b.onclick=()=>{go(dt);$('cal').classList.remove('open');$('calBtn').setAttribute('aria-pressed','false')};
    g.appendChild(b);
  }
}

function allDueItems(){
  const todayStr=ds(new Date());
  const doneToday=rd('routine-done:'+todayStr,[]);
  const out=[];
  Object.keys(localStorage).forEach(k=>{
    if(/^routine:\d{4}-\d{2}-\d{2}$/.test(k)){
      rd(k,[]).forEach(it=>{if(it.due&&!it.done)out.push({text:it.text,due:it.due})});
    }
  });
  repeats.forEach(r=>{if(r.due&&!doneToday.includes(r.id))out.push({text:r.text,due:r.due})});
  out.sort((a,b)=>a.due.localeCompare(b.due));
  return out;
}
function renderDueTab(){

  });
}
function projectStats(projText){
  let total=0,done=0;
  Object.keys(localStorage).forEach(k=>{
    if(/^routine:\d{4}-\d{2}-\d{2}$/.test(k)){rd(k,[]).forEach(it=>{if(it.proj===projText){total++;if(it.done)done++}})}
  });
  repeats.forEach(r=>{if(r.proj===projText)total++});
  return{total,done};
}
const escHtml=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
function goalOptionsHTML(selected){
  return '<option value="">No goal</option>'+goals.map(g=>'<option value="'+escHtml(g.text)+'"'+(g.text===selected?' selected':'')+'>'+escHtml(g.text)+'</option>').join('');
}
function projOptionsForGoal(goalText,selected){
  const ps=projects.filter(p=>p.goal===goalText);
  return '<option value="">No project</option>'+ps.map(p=>'<option value="'+escHtml(p.text)+'"'+(p.text===selected?' selected':'')+'>'+escHtml(p.text)+'</option>').join('');
}
function refreshProjectSelect(){

function projectStats2(projText){

function render(){
  $('num').textContent=date.getDate();
  $('day').textContent=date.toLocaleDateString('en-US',{weekday:'long'});
  $('month').textContent=date.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  document.title=$('day').textContent+', '+$('month').textContent;
  renderCal();

  const all=view(),done=all.filter(i=>i.done).length,pct=all.length?Math.round(done/all.length*100):0;
  $('fill').style.width=pct+'%';$('pb').setAttribute('aria-valuenow',pct);
  $('sum').textContent=all.length?done+' of '+all.length+' done':'No items planned yet';
  $('hideBtn').setAttribute('aria-pressed',hideDone);
  $('hideBtn').textContent=hideDone?'Show completed':'Hide completed';

  const tabs=$('tabs');tabs.innerHTML='';
  [['all','All']].concat(Object.entries(CATS)).forEach(([k,label])=>{
    const set=k==='all'?all:all.filter(i=>i.cat===k);
    const b=document.createElement('button');
    b.className='tab '+(k==='all'?'':k);b.setAttribute('aria-pressed',filter===k);
    b.innerHTML=(k==='all'?'':'<span class="dot"></span>')+'<span>'+label+'</span><small>'+set.filter(i=>i.done).length+'/'+set.length+'</small>';
    b.onclick=()=>{filter=k;if(k!=='all')$('c').value=k;render()};
    tabs.appendChild(b);
  });

  const list=$('list');list.innerHTML='';
  const shown=all.filter(i=>filter==='all'||i.cat===filter)
    .map(i=>({...i,order:i.order??(i.t?(+i.t.slice(0,2)*60+ +i.t.slice(3,5)):99999)}));
  if(!all.length){
    const wrap=document.createElement('div');wrap.className='empty';
    wrap.innerHTML='<div>Nothing planned here yet. Add your first item above.</div>';
    if(!items.length){
      const y=new Date(date);y.setDate(y.getDate()-1);
      if(rd(key(y),[]).length){const b=document.createElement('button');b.className='btn';b.textContent='Copy yesterday\u2019s plan';
        b.onclick=()=>{items=rd(key(y),[]).map(i=>({...i,id:uid(),done:false}));save();render()};wrap.appendChild(b)}
    }
    list.appendChild(wrap);return;
  }
  PARTS.forEach(([pk,name,range])=>{
    const g=shown.filter(i=>i.p===pk).sort((a,b)=>a.order-b.order);
    const visible=hideDone?g.filter(i=>!i.done):g;
    const grp=document.createElement('div');grp.className='group';
    const h=document.createElement('div');h.className='part';
    h.innerHTML='<h2></h2><span></span><small></small>';
    h.children[0].textContent=name;h.children[1].textContent=range;
    h.children[2].textContent=g.filter(i=>i.done).length+'/'+g.length;
    const ul=document.createElement('ul');ul.className='tasks';ul.dataset.p=pk;
    ul.addEventListener('dragover',e=>{if(!dragRef)return;e.preventDefault();ul.classList.add('over-empty')});
    ul.addEventListener('dragleave',e=>{if(e.target===ul)ul.classList.remove('over-empty')});
    ul.addEventListener('drop',e=>{ul.classList.remove('over-empty');if(e.target!==ul||!dragRef)return;e.preventDefault();moveToGroup(dragRef,pk)});
    if(visible.length)visible.forEach(i=>ul.appendChild(row(i)));
    else{const hint=document.createElement('div');hint.className='hint';
      hint.textContent=g.length?'All done here \u2014 hidden by the completed filter':'Drop a task here to move it to '+name.toLowerCase();
      ul.appendChild(hint)}
    grp.append(h,ul);list.appendChild(grp);
  });
  renderDueTab();
  renderGoalsTab();
}

$('f').addEventListener('submit',e=>{
  e.preventDefault();
  const text=$('x').value.trim();if(!text)return;
  const rule=$('r').value,cat=$('c').value;
  const base={id:uid(),text,t:$('t').value,t2:$('t2').value,cat,sub:cat==='wealth'?$('sub').value:'',p:$('p').value,due:$('due').value,proj:$('proj').value};
  let landedOn=null;
  if(rule==='once'){
    const due=base.due;
    if(due&&due!==ds(date)){
      const dkey='routine:'+due;const arr=rd(dkey,[]);arr.push({...base,done:false});wr(dkey,arr);if(dbReady)sharedCol.doc('day_'+due).set({items:arr}).catch(()=>{});landedOn=due;
    }else{items.push({...base,done:false});save()}
  }
  else if(rule==='range'){
    const start=$('ds1').value||ds(date),end=$('de1').value||start;
    repeats.push({...base,rule,start,end:end<start?start:end});saveR();
  }
  else if(rule==='monthly'){
    const day=Math.min(31,Math.max(1,+$('mday').value||date.getDate()));
    repeats.push({...base,rule,start:ds(date),day});saveR();
  }
  else{repeats.push({...base,rule,start:ds(date),wd:date.getDay()});saveR()}
  $('x').value='';$('t2').value='';$('due').value='';$('goalSel').value='';$('proj').innerHTML=projOptionsForGoal('','');
  if(landedOn){go(new Date(landedOn+'T12:00'))}else render();
  $('x').focus();
});

$('calPrev').onclick=()=>{calMonth.setMonth(calMonth.getMonth()-1);renderCal()};
$('calNext').onclick=()=>{calMonth.setMonth(calMonth.getMonth()+1);renderCal()};
$('hideBtn').onclick=()=>{hideDone=!hideDone;wr('routine:hideDone2',hideDone);render()};
function toggleBottom(which,btnId){
  const tab=$('dueTab'),cls='open-'+which,isOpen=tab.classList.contains(cls);
  tab.classList.remove('open-due','open-goals');
  $('dueToggle').setAttribute('aria-expanded','false');$('goalsToggle').setAttribute('aria-expanded','false');
  if(!isOpen){tab.classList.add(cls);$(btnId).setAttribute('aria-expanded','true');$('dueBackdrop').classList.add('show')}
  else{$('dueBackdrop').classList.remove('show')}
}
function closeBottom(){
  $('dueTab').classList.remove('open-due','open-goals');
  $('dueToggle').setAttribute('aria-expanded','false');$('goalsToggle').setAttribute('aria-expanded','false');
  $('dueBackdrop').classList.remove('show');
}
$('dueToggle').onclick=()=>toggleBottom('due','dueToggle');
$('goalsToggle').onclick=()=>toggleBottom('goals','goalsToggle');
$('dueBackdrop').onclick=closeBottom;
$('goalSel').addEventListener('change',()=>{$('proj').innerHTML=projOptionsForGoal($('goalSel').value,'')});
refreshProjectSelect();
renderGoalsTab();
render();
initSync();
</script>
